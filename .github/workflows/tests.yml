name: Pruebas

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Verificar contrato OpenAPI y respuestas HTTP
        run: python -m pytest tests/contract -v -p no:cacheprovider --junitxml=reports/contract.xml
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
      - name: Guardar resultado de pruebas de contrato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-contrato
          path: backend/reports/contract.xml
          if-no-files-found: warn
      - name: Ejecutar pruebas funcionales y de arquitectura
        run: python -m pytest tests --ignore=tests/contract
