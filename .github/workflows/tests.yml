name: Pruebas

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Las pruebas corren contra PostgreSQL real (ADR 0013): constraints, RLS y
    # migraciones no se pueden comprobar en SQLite.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tienda
          POSTGRES_PASSWORD: tienda
          POSTGRES_DB: tienda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tienda -d tienda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://tienda:tienda@localhost:5432/tienda_test
      APP_DB_USER: tienda_app
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Validar Docker Compose de Dokploy
        working-directory: .
        run: docker compose -f deploy/compose.lab.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-validation-only
          APP_DB_PASSWORD: ci-validation-only
          JWT_SECRET: ci-validation-only
      # Mismo script que inicializa el volumen en Docker (ADR 0014); aquí psql
      # llega al servicio por TCP gracias a PGHOST.
      - name: Crear el rol de aplicación sujeto a RLS
        working-directory: .
        run: sh deploy/postgres/initdb/10-rol-aplicacion.sh
        env:
          PGHOST: localhost
          PGPASSWORD: tienda
          POSTGRES_USER: tienda
          POSTGRES_DB: tienda_test
          APP_DB_PASSWORD: ci-app-only
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        run: 'pip install --only-binary :all: -r requirements-dev.txt'
      - name: Verificar contrato OpenAPI y respuestas HTTP
        run: python -m pytest tests/contract -v -p no:cacheprovider --junitxml=reports/contract.xml
      - name: Guardar resultado de pruebas de contrato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-contrato
          path: backend/reports/contract.xml
          if-no-files-found: warn
      - name: Ejecutar pruebas funcionales, de esquema, RLS y arquitectura
        run: python -m pytest tests --ignore=tests/contract
      - name: Verificar que modelos y migraciones coinciden (alembic check)
        run: |
          alembic upgrade head
          alembic check
      - name: Análisis estático (Ruff)
        run: pipx run --spec ruff==0.13.2 ruff check app tests scripts alembic

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      # Va antes de setup-node: `cache: pnpm` necesita pnpm en el PATH. Sin
      # `version`, la acción toma la de `packageManager` (ADR 0015); como no
      # hay package.json en la raíz, se le indica el del frontend.
      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Instalar dependencias
        # `--ignore-scripts` (SonarQube S6505): ninguna dependencia de este
        # proyecto necesita scripts de instalación — esbuild, sharp y
        # unrs-resolver resuelven sus binarios por paquete de plataforma — y
        # sin este flag un `postinstall` de un paquete transitivo se ejecutaría
        # con permisos de escritura en el runner. `--frozen-lockfile` falla si
        # pnpm-lock.yaml no corresponde a package.json (equivale a `npm ci`).
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verificar paleta (sin colores fuera de tokens.css)
        run: pnpm run check:tokens
      - name: Verificar estilo (ESLint)
        run: pnpm run lint
      - name: Verificar tipos (TypeScript)
        run: pnpm run typecheck
      - name: Pruebas unitarias con cobertura
        run: pnpm run test:coverage
      - name: Guardar cobertura para Sonar
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: warn
      - name: Construir frontend standalone
        run: pnpm run build

  # Requiere el secreto SONAR_TOKEN y el proyecto registrado en la
  # organización ISCO-UTB (sonar-project.properties). Mientras el secreto no
  # exista, el paso se omite limpiamente; al configurarlo, el análisis corre y
  # bloquea el merge vía protección de rama.
  sonarcloud:
    runs-on: ubuntu-latest
    # La cobertura del frontend la produce el job `frontend`: sin `needs` este
    # job arrancaba en paralelo y el artefacto todavía no existía
    # ("Artifact not found for name: frontend-coverage").
    needs: [frontend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Descargar repositorio
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo mejora la relevancia del análisis
      - name: Recuperar la cobertura del frontend
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Análisis SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
      # Diagnóstico: solo corre si el análisis falló. El error del escáner
      # ("Not authorized or project not found") no distingue entre un token sin
      # permiso de análisis, un usuario que no pertenece a la organización y
      # una clave de proyecto equivocada; estas consultas lo separan. El token
      # viaja en la cabecera y nunca se imprime.
      - name: Diagnosticar el fallo del análisis
        if: failure() && env.SONAR_TOKEN != ''
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          set +x
          echo "::group::Validez del token"
          curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/authentication/validate" || true
          echo
          echo "::group::Identidad y permisos del token"
          curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/users/current" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('login:', d.get('login')); print('organizaciones:', [o.get('key') for o in d.get('organizations',[])]); print('ejecutar análisis:', d.get('permissions',{}).get('executeAnalysis')); print('permisos:', sorted(d.get('permissions',{}).keys()))" || true
          echo "::endgroup::"
          echo "::group::Visibilidad del proyecto"
          curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/projects/search?organization=isco-utb&projects=ISCOUTB_AS_202620_TIENDA-VIRTUAL-UTB" || true
          echo
          echo "::endgroup::"
