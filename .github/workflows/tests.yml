name: Pruebas

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Validar Docker Compose de Dokploy
        working-directory: .
        run: docker compose -f deploy/compose.lab.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-validation-only
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        run: 'pip install --only-binary :all: -r requirements-dev.txt'
      - name: Verificar contrato OpenAPI y respuestas HTTP
        run: python -m pytest tests/contract -v -p no:cacheprovider --junitxml=reports/contract.xml
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
      - name: Guardar resultado de pruebas de contrato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-contrato
          path: backend/reports/contract.xml
          if-no-files-found: warn
      - name: Ejecutar pruebas funcionales y de arquitectura
        run: python -m pytest tests --ignore=tests/contract
      - name: Análisis estático (Ruff)
        run: pipx run --spec ruff==0.13.2 ruff check app tests scripts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Construir frontend standalone
        run: npm run build

  # Requiere el secreto SONAR_TOKEN y el proyecto registrado en la
  # organización ISCO-UTB (sonar-project.properties). Mientras el secreto no
  # exista, el paso se omite limpiamente; al configurarlo, el análisis corre y
  # bloquea el merge vía protección de rama.
  sonarcloud:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Descargar repositorio
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo mejora la relevancia del análisis
      - name: Análisis SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
