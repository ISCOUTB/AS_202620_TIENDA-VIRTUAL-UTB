name: Terraform

# Verificación estática de la infraestructura declarada en `infra/`.
#
# Se limita a `fmt`, `validate` y `tflint` a propósito, sin `plan`. Un `plan` en
# CI necesitaría los cuatro tokens de API como secretos del repositorio y
# además un estado remoto: el estado vive en local y en git-ignorado (ver
# infra/README.md), así que no hay nada compartido que un plan pudiera leer.
# Publicar los cuatro tokens para poder calcular un plan solo para verlo sería
# ampliar el radio de acción de los secretos sin aportar garantía nueva: la
# revisión del plan sigue siendo una tarea local, antes de cada `apply`.

on:
  push:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  verificar:
    name: infra
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      # `terraform init` sin `-upgrade`: los providers están fijados en
      # `infra/versions.tf` y en `.terraform.lock.hcl`. Subir de versión es una
      # decisión deliberada y revisada, no un efecto colateral de cada push.
      - name: Inicializar
        run: terraform init -backend=false -input=false

      - name: Formato
        run: terraform fmt -check -recursive -diff

      - name: Validar
        run: terraform validate

      - name: Lint
        uses: terraform-linters/setup-tflint@v5
      # El directorio de trabajo del job es `infra`, así que la configuración se
      # referencia con ruta relativa a él, no como `infra/.tflint.hcl`.
      - name: Ejecutar tflint
        run: tflint --init --config=.tflint.hcl && tflint --recursive
