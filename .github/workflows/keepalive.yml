name: Keep-alive

# El plan free de Render suspende el servicio tras ~15 min sin tráfico externo
# (los health checks internos de Render no cuentan). Este cron hace un GET a
# /health cada 10 min para mantener la API despierta durante la evaluación.
# Alternativa externa documentada: monitor UptimeRobot (docs/despliegue-s8.md).
#
# El cron no se puede declarar en Terraform: el provider integrations/github no
# tiene recurso para la programación de workflows. Lo que sí gestiona Terraform
# es la variable `API_HEALTH_URL` del repositorio, de modo que esta URL sigue a
# la API si Render le cambia el dominio.
#
# `API_HEALTH_URL` tiene un valor de reserva, la URL de la API que está en
# producción hoy. Ese fallback no es un parche: es lo que permite que este
# workflow funcione durante la ventana en la que el apply todavía no ha
# ocurrido. Sin él, publicar la variable antes de crearla dejaría el keep-alive
# fallando cada 10 minutos, Render suspendería la instancia por inactividad y
# la web se caería por un cambio que no toca la aplicación en sí. Con él, el
# ping va a la API actual desde el primer minuto y salta sola a la nueva en
# cuanto Terraform cree la variable.
#
# El ping nunca se omite en silencio: si la variable no existe se usa el valor
# de reserva, y si ese llegara a estar vacío también, el `curl` a una URL vacía
# falla. Así que "el keep-alive no falló" significa siempre que alguien intentó
# pings de verdad.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  # Valor de reserva mientras la variable de repositorio no exista. Debe
  # desaparecer en cuanto `terraform apply` cree `API_HEALTH_URL`.
  API_HEALTH_URL_FALLBACK: https://tienda-utb-api.onrender.com/health

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver la URL del health check
        id: url
        run: |
          url="${{ vars.API_HEALTH_URL }}"
          if [ -z "$url" ]; then
            echo "::notice::API_HEALTH_URL no está definida todavía; se usa el" \
                 "valor de reserva. Se gestionará con 'terraform apply'."
            url="$API_HEALTH_URL_FALLBACK"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Ping al health check de la API desplegada
        run: curl -fsS --max-time 30 "${{ steps.url.outputs.url }}"
