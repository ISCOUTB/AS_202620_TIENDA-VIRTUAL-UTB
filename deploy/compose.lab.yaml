name: tienda-virtual-utb

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tienda_utb}
      POSTGRES_USER: ${POSTGRES_USER:-tienda_utb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en Dokploy}
      # Rol de login de la API, creado por ./postgres/initdb (ADR 0014).
      APP_DB_USER: ${APP_DB_USER:-tienda_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en Dokploy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - internal

  # Tarea única: aplica las migraciones con el rol dueño y termina (ADR 0013).
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-tienda_utb}
      DB_MIGRATIONS_USER: ${POSTGRES_USER:-tienda_utb}
      DB_MIGRATIONS_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en Dokploy}
      DB_USER: ${APP_DB_USER:-tienda_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en Dokploy}
      APP_DB_USER: ${APP_DB_USER:-tienda_app}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - internal

  # Tarea única opcional: siembra los datos de demostración tras migrar. Solo
  # actúa con SEED_ON_DEPLOY=true; si no, termina con código 0 sin tocar la base.
  seed:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "if [ \"$$SEED_ON_DEPLOY\" = \"true\" ]; then python -m app.seed; else echo 'SEED_ON_DEPLOY distinto de true: seed omitido'; fi"]
    restart: "no"
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-tienda_utb}
      DB_MIGRATIONS_USER: ${POSTGRES_USER:-tienda_utb}
      DB_MIGRATIONS_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en Dokploy}
      DB_USER: ${APP_DB_USER:-tienda_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en Dokploy}
      APP_DB_USER: ${APP_DB_USER:-tienda_app}
      SEED_ON_DEPLOY: ${SEED_ON_DEPLOY:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    networks:
      - internal

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-tienda_utb}
      # La API usa el rol de aplicación, sujeto a RLS; nunca el dueño.
      DB_USER: ${APP_DB_USER:-tienda_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en Dokploy}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    expose:
      - "8000"
    networks:
      - internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # `NEXT_PUBLIC_*` se hornea en el bundle: es la URL pública del sitio
        # y alimenta `sitemap.xml`, `robots.txt` y las URLs canónicas.
        NEXT_PUBLIC_SITIO_URL: ${NEXT_PUBLIC_SITIO_URL:-https://tiendautb-sistema-n0ojjk-fde272-144-24-4-187.sslip.io}
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
