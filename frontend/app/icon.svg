<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tienda Virtual UTB">
  <!--
    Favicon: la sábana azul de la app (SPEC v3) con la U del wordmark en
    blanco y el punto ámbar de marca. Los valores replican --tk-sabana-1
    (#0b2bd6), --tk-sabana-2 (#2b4dff) y --tk-ambar (#ffc300) de
    app/tokens.css. Un favicon es un archivo autocontenido: no puede leer
    variables CSS del documento que lo incrusta.
  -->
  <defs>
    <linearGradient id="sabana" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2bd6"/>
      <stop offset="1" stop-color="#2b4dff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#sabana)"/>
  <path d="M17 16h9v20c0 4.4 2.4 6.8 6 6.8s6-2.4 6-6.8V16h9v20.6C47 46.2 41.6 52 32 52s-15-5.8-15-15.4z" fill="#ffffff"/>
  <circle cx="50" cy="14" r="5" fill="#ffc300"/>
</svg>
