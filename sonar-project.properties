# Configuración del análisis de SonarCloud en CI (job `sonarcloud`).
# Organización ISCO-UTB. El projectKey lo genera SonarCloud al registrar el
# repositorio; verificarlo en sonarcloud.io (Information > Project key).
sonar.projectKey=ISCOUTB_AS_202620_TIENDA-VIRTUAL-UTB
sonar.organization=isco-utb
sonar.projectName=Tienda Virtual UTB
sonar.sourceEncoding=UTF-8

# Código mantenido a mano de las dos aplicaciones.
sonar.sources=backend/app,frontend/app,frontend/components,frontend/lib

# Pruebas: pytest (backend) y Vitest (frontend).
sonar.tests=backend/tests,frontend/tests

# Cobertura del frontend. La produce `pnpm run test:coverage`; el job
# `sonarcloud` recupera `frontend/coverage/lcov.info` del artefacto
# `frontend-coverage` que publica el job `frontend`.
# El backend todavía no publica reporte de cobertura (usa pytest sin
# `--cov`); cuando lo haga se añade aquí `sonar.python.coverage.reportPaths`.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusiones:
#  - artefactos de herramientas y dependencias;
#  - documentación y HTML generado;
#  - el cliente OpenAPI del frontend, que genera scripts/gen-api.mjs (no se
#    edita a mano y no representa lógica propia).
sonar.exclusions=**/node_modules/**,docs/**,**/.pytest_cache/**,**/__pycache__/**,frontend/lib/api/generated/**,**/*.min.js
sonar.cpd.exclusions=frontend/lib/api/generated/**
