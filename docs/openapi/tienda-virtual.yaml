openapi: 3.1.0
info:
  title: Tienda Virtual UTB
  description: |
    API REST del monolito modular de la Tienda Virtual UTB.
    
    ## Arquitectura
    
    El backend está organizado en módulos de dominio (bounded contexts):
    
    - **identity** — Autenticación, registro y gestión de usuarios
    - **catalog** — Catálogo de productos disponibles para la venta
    - **inventory** — Control de existencias y movimientos de stock
    - **orders** — Gestión de pedidos de compra
    
    ## Convenciones
    
    - Precios en **centavos COP** (ej: 350000 = $3.500 COP)
    - Autenticación via **Bearer JWT** (endpoints protegidos)
    - IDs incrementales enteros
    - Fechas en formato ISO 8601 UTC
    - Estados de pedido y roles: los del esquema de base de datos (ADR 0013)

    Desde la versión 0.4.0 todas las operaciones de este documento están
    implementadas; el contrato ejecutable es `docs/api/openapi.json`.
  version: 0.4.0
  contact:
    name: Equipo Tienda Virtual UTB
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: Desarrollo local

tags:
  - name: operacion
    description: Health checks y operaciones de infraestructura
  - name: identity
    description: Autenticación y gestión de usuarios
  - name: catalogo
    description: Consulta del catálogo de productos
  - name: inventory
    description: Lectura de disponibilidad y futuros ajustes protegidos
  - name: orders
    description: Gestión de pedidos de compra

paths:
  # ──────────────────────────────────────────────
  # OPERACIONES
  # ──────────────────────────────────────────────
  /health:
    get:
      operationId: healthCheck
      tags: [operacion]
      summary: Health check (liveness)
      description: Confirma que el proceso de la API está disponible.
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /health/ready:
    get:
      operationId: readinessCheck
      tags: [operacion]
      summary: Readiness check
      description: Verifica que el proceso y la base de datos responden.
      responses:
        "200":
          description: Servicio listo para atender tráfico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /metrics:
    get:
      operationId: getMetrics
      tags: [operacion]
      summary: Métricas HTTP del proceso
      description: |
        Conteo de peticiones, errores 5xx y percentiles de latencia por ruta.
        Métrica ligada al escenario 4 de disponibilidad.
      responses:
        "200":
          description: Resumen de métricas en memoria
          content:
            application/json:
              schema:
                type: object

  # ──────────────────────────────────────────────
  # IDENTITY
  # ──────────────────────────────────────────────
  /identity/register:
    post:
      operationId: registerUser
      tags: [identity]
      summary: Registrar nuevo usuario
      description: Crea una cuenta de usuario con credenciales.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOut"
        "409":
          description: El correo ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /identity/login:
    post:
      operationId: loginUser
      tags: [identity]
      summary: Iniciar sesión
      description: Autentica un usuario y devuelve un token JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /identity/me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Obtener usuario actual
      description: Retorna el perfil del usuario autenticado.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOut"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────
  # CATALOG
  # ──────────────────────────────────────────────
  /catalog/products:
    get:
      operationId: listProducts
      tags: [catalogo]
      summary: Listar productos
      description: |
        Retorna los productos activos de tiendas activas, ordenados
        alfabéticamente. Con `incluir_inactivos=true` y un token, añade los
        inactivos de las tiendas que el usuario gestiona.
      parameters:
        - name: incluir_inactivos
          in: query
          schema:
            type: boolean
            default: false
          description: Incluye los inactivos de las tiendas que el usuario gestiona.
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductOut"

    post:
      operationId: createProduct
      tags: [catalogo]
      summary: Registrar un producto
      description: |
        Registra un producto en una tienda. Sus existencias se cargan aparte,
        en Inventario. **Requiere ser administrador de la tienda.**
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Tienda no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ya existe un producto con ese nombre en la tienda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /catalog/products/{productId}:
    get:
      operationId: getProductById
      tags: [catalogo]
      summary: Obtener producto por ID
      description: Retorna un producto específico del catálogo.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Detalle del producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOut"
        "404":
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateProduct
      tags: [catalogo]
      summary: Editar un producto
      description: |
        Edita uno o varios campos, o habilita/deshabilita la venta (`activo`).
        **Requiere ser administrador de la tienda.**
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ya existe un producto con ese nombre en la tienda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /catalog/tiendas:
    get:
      operationId: listStores
      tags: [catalogo]
      summary: Listar tiendas
      description: Tiendas activas de la cafetería.
      responses:
        "200":
          description: Lista de tiendas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TiendaOut"

  # ──────────────────────────────────────────────
  # INVENTORY
  # ──────────────────────────────────────────────
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: Listar inventario
      description: |
        Retorna la disponibilidad necesaria para presentar el catálogo.
        La lectura es pública; los ajustes requieren rol.
      responses:
        "200":
          description: Inventario completo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockAvailabilityOut"

  /inventory/{productId}:
    get:
      operationId: getInventoryByProduct
      tags: [inventory]
      summary: Consultar stock de un producto
      description: Retorna las existencias de un producto específico.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Stock del producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemOut"
        "404":
          description: Producto no encontrado en inventario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: updateInventory
      tags: [inventory]
      summary: Actualizar stock de un producto
      description: |
        Establece la cantidad de existencias de un producto (conteo físico).
        **Requiere gestionar el inventario de la tienda** (`responsable_inventario`
        o `admin_tienda` de esa tienda, o `admin_general`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryUpdateRequest"
      responses:
        "200":
          description: Stock actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemOut"
        "400":
          description: Cantidad inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inventory/{productId}/adjust:
    post:
      operationId: adjustInventory
      tags: [inventory]
      summary: Ajustar stock (incremento/decremento)
      description: |
        Ajusta el stock de un producto de forma relativa (positivo o negativo).
        Útil para reposiciones o ajustes por merma.
        **Requiere gestionar el inventario de la tienda.**
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryAdjustRequest"
      responses:
        "200":
          description: Stock ajustado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemOut"
        "400":
          description: Ajuste inválido (stock insuficiente o cantidad cero)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ──────────────────────────────────────────────
  # ORDERS
  # ──────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: Listar pedidos del usuario
      description: |
        Retorna los pedidos del usuario autenticado o, con `tienda_id`, la
        cola de pedidos de una tienda que el usuario gestiona.
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
          description: Filtrar por estado del pedido
        - name: tienda_id
          in: query
          schema:
            type: integer
          description: Pedidos de una tienda que el usuario gestiona
      responses:
        "200":
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderOut"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createOrder
      tags: [orders]
      summary: Crear nuevo pedido
      description: |
        Crea un pedido por cada tienda del carrito y descuenta sus unidades.
        El total se calcula sumando (precio × cantidad) de cada ítem.
        Repetir la `Idempotency-Key` devuelve los pedidos originales (200)
        sin volver a descontar stock (docs/idempotencia-saga-s11.md).
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: UUID por intento de compra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "201":
          description: Pedidos creados, uno por tienda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderOut"
        "200":
          description: Reintento con la misma Idempotency-Key
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderOut"
        "400":
          description: Producto no disponible, stock insuficiente o llave vencida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{orderId}:
    get:
      operationId: getOrderById
      tags: [orders]
      summary: Obtener detalle de un pedido
      description: Retorna el detalle completo de un pedido específico.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
          description: ID del pedido
      responses:
        "200":
          description: Detalle del pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No tiene acceso a este pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      tags: [orders]
      summary: Cancelar un pedido
      description: |
        Cancela un pedido y repone el stock. El comprador puede hacerlo
        mientras el pedido esté en `pendiente_pago`; la tienda, mientras no
        se haya entregado.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
          description: ID del pedido
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCancelRequest"
      responses:
        "200":
          description: Pedido cancelado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderOut"
        "400":
          description: El pedido no se puede cancelar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ════════════════════════════════════════════════
# COMPONENTS
# ════════════════════════════════════════════════
  /orders/{orderId}/estado:
    post:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Avanzar el estado de un pedido
      description: |
        La tienda confirma el pago y avanza el pedido:
        `pendiente_pago → pagado → en_preparacion → listo → entregado`.
        **Requiere gestionar la tienda del pedido.**
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
          description: ID del pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusRequest"
      responses:
        "200":
          description: Pedido actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderOut"
        "400":
          description: Transición no permitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  # ── Seguridad ─────────────────────────────────
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido en /identity/login

  # ── Parámetros reutilizables ──────────────────
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
      description: ID del producto

  # ── Respuestas reutilizables ──────────────────
  responses:
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Sin permisos suficientes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  # ── Schemas ───────────────────────────────────
  schemas:
    # --- Operacion ---
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok

    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
          example: ok
        detalle:
          type: string
          nullable: true
          description: Motivo del fallo cuando status = error
          example: "base de datos no disponible"

    # --- Identity ---
    RegisterRequest:
      type: object
      required: [nombre, email, password]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan@utb.edu.co"
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: "MiContraseña123"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "juan@utb.edu.co"
        password:
          type: string
          example: "MiContraseña123"

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Token JWT
          example: "eyJhbGciOiJIUzI1NiIs..."
        token_type:
          type: string
          enum: [bearer]
          example: "bearer"
        expires_in:
          type: integer
          description: TTL en segundos
          example: 3600

    UserOut:
      type: object
      required: [id, nombre, email, roles, creado_en]
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan@utb.edu.co"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RolAsignado"
        creado_en:
          type: string
          format: date-time
          example: "2026-09-15T10:30:00Z"

    RolAsignado:
      type: object
      required: [codigo]
      properties:
        codigo:
          $ref: "#/components/schemas/CodigoRol"
        tienda_id:
          type: integer
          nullable: true
          description: Tienda donde vale el rol; null = todas

    CodigoRol:
      type: string
      enum: [comprador, admin_general, admin_tienda, responsable_inventario]
      description: |
        - **comprador** — Hace pedidos (todo usuario registrado)
        - **admin_general** — Administra todo el sistema y asigna roles
        - **admin_tienda** — Administra el catálogo, el inventario y los pedidos de su tienda
        - **responsable_inventario** — Ajusta existencias y atiende pedidos de su tienda
      example: "comprador"

    # --- Catalog ---
    ProductOut:
      type: object
      required: [id, nombre, descripcion, precio_centavos]
      description: Contrato del módulo Catálogo; no contiene datos de Inventario
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          maxLength: 120
          example: "Café americano"
        descripcion:
          type: string
          maxLength: 400
          example: "Vaso de 8 oz"
        precio_centavos:
          type: integer
          description: Precio en centavos COP (350000 = $3.500)
          example: 350000
        tienda:
          type: string
          nullable: true
          description: Slug de la tienda dueña del producto
          example: "alegria"
        imagen_url:
          type: string
          nullable: true
          description: Ruta relativa de la imagen principal
        categoria:
          type: string
          nullable: true
          example: "Bebidas"
        presentacion:
          type: string
          nullable: true
          description: Variante en la vitrina (Grande, Personal, Entero...)
        precio_confirmado:
          type: boolean
          description: false = precio de referencia que la tienda aún no confirmó
        activo:
          type: boolean
          description: Habilitado para la venta

    TiendaOut:
      type: object
      required: [id, identificador, nombre, descripcion]
      properties:
        id:
          type: integer
        identificador:
          type: string
          description: Slug de la tienda
          example: "antojos"
        nombre:
          type: string
        descripcion:
          type: string
        logo_url:
          type: string
          nullable: true

    ProductCreateRequest:
      type: object
      required: [tienda, nombre, precio_centavos]
      properties:
        tienda:
          type: string
          description: Slug de la tienda
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: string
          maxLength: 400
        precio_centavos:
          type: integer
          minimum: 0
        categoria:
          type: string
          nullable: true
        presentacion:
          type: string
          nullable: true
        precio_confirmado:
          type: boolean
        activo:
          type: boolean

    ProductUpdateRequest:
      type: object
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        precio_centavos:
          type: integer
          minimum: 0
        categoria:
          type: string
          nullable: true
        presentacion:
          type: string
          nullable: true
        precio_confirmado:
          type: boolean
        activo:
          type: boolean

    # --- Inventory ---
    StockAvailabilityOut:
      type: object
      required: [product_id, existencias]
      properties:
        product_id:
          type: integer
          example: 1
        existencias:
          type: integer
          minimum: 0
          description: Unidades disponibles en stock
          example: 40

    InventoryItemOut:
      type: object
      required: [product_id, product_nombre, cantidad, actualizado_en]
      properties:
        product_id:
          type: integer
          example: 1
        product_nombre:
          type: string
          example: "Café americano"
        cantidad:
          type: integer
          minimum: 0
          description: Unidades disponibles en stock
          example: 40
        actualizado_en:
          type: string
          format: date-time
          example: "2026-09-15T12:00:00Z"

    InventoryUpdateRequest:
      type: object
      required: [cantidad]
      properties:
        cantidad:
          type: integer
          minimum: 0
          description: Nueva cantidad absoluta de stock
          example: 50
        motivo:
          type: string
          maxLength: 200
          description: Razón del cambio (por defecto "Conteo de existencias")

    InventoryAdjustRequest:
      type: object
      required: [delta, motivo]
      properties:
        delta:
          type: integer
          description: |
            Incremento relativo del stock.
            Positivo = reposición, negativo = venta/merma.
          example: -5
        motivo:
          type: string
          maxLength: 200
          description: Razón del ajuste (obligatorio para auditoría)
          example: "Venta realizada"

    # --- Orders ---
    OrderStatus:
      type: string
      enum: [pendiente_pago, pagado, en_preparacion, listo, entregado, cancelado]
      description: |
        Estados del ciclo de vida de un pedido (ADR 0013):
        - **pendiente_pago** — Creado, stock descontado, esperando el pago en el mostrador (vence a las 24 h)
        - **pagado** — La tienda confirmó el pago
        - **en_preparacion** — La tienda lo está preparando
        - **listo** — Listo para recoger
        - **entregado** — Recogido por el comprador
        - **cancelado** — Anulado (stock repuesto)
      example: "pendiente_pago"

    OrderCreateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          description: Productos a incluir en el pedido
          items:
            $ref: "#/components/schemas/OrderItemRequest"
        hora_recogida:
          type: string
          format: time
          nullable: true
          description: Franja acordada con el mostrador (America/Bogota)

    OrderItemRequest:
      type: object
      required: [product_id, cantidad]
      properties:
        product_id:
          type: integer
          description: ID del producto a comprar
          example: 1
        cantidad:
          type: integer
          minimum: 1
          description: Unidades a solicitar
          example: 2

    OrderOut:
      type: object
      required: [id, usuario_id, tienda_id, items, total_centavos, estado, creado_en, actualizado_en]
      properties:
        id:
          type: integer
          example: 1
        usuario_id:
          type: integer
          description: ID del usuario que realizó el pedido
          example: 1
        tienda_id:
          type: integer
          description: Un pedido pertenece a una sola tienda
        tienda:
          type: string
          nullable: true
          description: Slug de la tienda del pedido
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemOut"
        total_centavos:
          type: integer
          description: Total del pedido en centavos COP
          example: 700000
        estado:
          $ref: "#/components/schemas/OrderStatus"
        hora_recogida:
          type: string
          format: time
          nullable: true
        creado_en:
          type: string
          format: date-time
          example: "2026-09-15T14:30:00Z"
        actualizado_en:
          type: string
          format: date-time

    OrderCancelRequest:
      type: object
      properties:
        motivo:
          type: string
          maxLength: 200
          nullable: true

    OrderStatusRequest:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [pagado, en_preparacion, listo, entregado]
        comentario:
          type: string
          maxLength: 200
          nullable: true

    OrderItemOut:
      type: object
      required: [product_id, product_nombre, cantidad, precio_unitario_centavos, subtotal_centavos]
      properties:
        product_id:
          type: integer
          example: 1
        product_nombre:
          type: string
          example: "Café americano"
        cantidad:
          type: integer
          example: 2
        precio_unitario_centavos:
          type: integer
          description: Precio al momento de la compra
          example: 350000
        subtotal_centavos:
          type: integer
          description: precio_unitario × cantidad
          example: 700000

    # --- Errores ---
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Mensaje descriptivo del error
          example: "Producto no encontrado"
