services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tienda_utb}
      POSTGRES_USER: ${POSTGRES_USER:-tienda_utb}
      # Requerida vía .env (ver .env.example): los secretos no se versionan.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD - copia .env.example a .env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tienda_utb -d tienda_utb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-tienda_utb}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-tienda_utb}"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
