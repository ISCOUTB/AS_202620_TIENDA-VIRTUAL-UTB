# Configuración de Alembic (ADR 0013). Ejecutar desde `backend/`:
#   alembic upgrade head
#   alembic check
#
# La URL NO se define aquí: alembic/env.py la toma de
# app.shared.database.resolve_database_url(migraciones=True), es decir de
# MIGRATIONS_DATABASE_URL, DB_MIGRATIONS_* o, en su defecto, DATABASE_URL/DB_*.

[alembic]
script_location = %(here)s/alembic
# Permite importar el paquete `app` sin importar desde qué carpeta se invoque.
prepend_sys_path = %(here)s
file_template = %%(rev)s
version_path_separator = os
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
