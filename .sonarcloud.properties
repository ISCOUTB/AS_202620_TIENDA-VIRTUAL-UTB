# Configuración del análisis automático de SonarCloud (Automatic Analysis).
#
# IMPORTANTE: este archivo debe mantenerse alineado con
# `sonar-project.properties`, que es el que usa el job de CI. El análisis
# automático no lee el reporte de cobertura ni los tests de Vitest, pero las
# exclusiones deben coincidir para que el tablero no muestre hallazgos distintos
# según quién haya disparado el análisis.
#
# Se excluyen los artefactos HTML generados por herramientas (archify, Redoc):
# no son código mantenido a mano y el parser HTML de SonarQube produce falsos
# positivos sobre ellos por los data-URI y SVG embebidos.
sonar.sources=backend/app,frontend/app,frontend/components,frontend/lib
sonar.exclusions=**/node_modules/**,docs/**,**/.pytest_cache/**,**/__pycache__/**,frontend/lib/api/generated/**,**/*.min.js
sonar.cpd.exclusions=frontend/lib/api/generated/**
