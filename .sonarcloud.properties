# Configuración del análisis automático de SonarCloud (Automatic Analysis).
# Este archivo solo aplica al análisis automático; el job de CI usa
# sonar-project.properties cuando se configure SONAR_TOKEN.
#
# Se excluyen los artefactos HTML generados por herramientas (archify, Redoc):
# no son código mantenido a mano y el parser HTML de SonarQube produce falsos
# positivos sobre ellos por los data-URI y SVG embebidos (bugs reportados en
# líneas que no corresponden al contenido real del documento).
sonar.exclusions=docs/**/*.html
